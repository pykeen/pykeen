name: Lint

on:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.14" ]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check static typing with MyPy
        run: tox -e mypy

  lint-single-version:
    name: Lint Single Version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-tox
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check code quality
      run: tox -e lint

    - name: Check package metadata with Pyroma
      run: tox -e pyroma
    
    - name: Check docstring coverage
      run: tox -e docstr-coverage

    - name: Check manifest
      run: tox -e manifest

    - name: Check RST conformity with doc8
      run: tox -e doc8

    - name: Check RST markup with sphinx-lint
      run: tox -e sphinx-lint


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'merge_group' }}
