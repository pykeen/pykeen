name: Lint

on:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:
  # catch dependency releases that break the linters while the repository stands still
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check static typing with MyPy
        run: tox -e mypy

  lint-single-version:
    name: Lint Single Version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-tox
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check code quality
      run: tox -e lint

    - name: Check package metadata with Pyroma
      run: tox -e pyroma

    - name: Check RST conformity with doc8
      run: tox -e doc8

    - name: Check RST markup with sphinx-lint
      run: tox -e sphinx-lint

    - name: Check RST formatting with docstrfmt
      run: tox -e docstrfmt


  mypy-unlocked:
    name: MyPy (newest dependencies)
    # the pull-request job resolves from uv.lock; this one resolves fresh, so that
    # upstream drift is reported here instead of in somebody's unrelated PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check static typing against the newest dependencies
        run: tox -e mypy-unlocked

  report-failure:
    name: Report scheduled failure
    needs: [ lint, lint-single-version, mypy-unlocked ]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure-issue.yml
    with:
      workflow: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'merge_group' }}
