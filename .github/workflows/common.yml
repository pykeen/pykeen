name: Common

on:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    strategy:
      matrix:
        # no need to check documentation with multiple python versions
        python-version: [ "3.14" ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache dependencies, cf. https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
          cache: 'pip'
          cache-dependency-path: './pyproject.toml'
      
      - name: Install dependencies
        run: pip install tox tox-uv
      
      # - name: Check RST format
      #   run: tox -e doclint

      - name: Check README.rst
        run: tox -e readme

      - name: Check documentation build with Sphinx
        run: |
          sudo apt-get install graphviz
          tox -e docs-test
  tests:
    name: Tests
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [ "3.10", "3.14" ]
        include:
          # macos-latest is now an Apple Silicon (arm64) runner; torch and torch_geometric both
          # ship arm64 wheels, so this now works. Kept to a single combination since macOS
          # runners are billed at a much higher rate than Linux/Windows.
          # resolve_device() never selects mps (it only falls back cuda -> cpu), so this only
          # exercises the CPU path -- it does not cover the still-unresolved MPS support in
          # torch_max_mem, cf. https://github.com/mberr/torch-max-mem/issues/14
          - os: macos-latest
            python-version: "3.14"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache dependencies, cf. https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
          cache: 'pip'
          cache-dependency-path: './pyproject.toml'
      
      - name: Install dependencies
        run: pip install tox tox-uv
      
      - name: Run fast tests
        run: tox -e py
      
      - name: Run slow tests
        run: tox -e integration
      
      - name: Run doctests
        run: tox -e doctests
      
      # - name: Test notebooks
      #   run: tox -e treon

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
