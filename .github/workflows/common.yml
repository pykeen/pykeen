name: Common

on:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    strategy:
      matrix:
        # no need to check documentation with multiple python versions
        python-version: [ "3.14" ]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check README.rst
        run: tox -e readme

      - name: Check documentation build with Sphinx
        run: |
          sudo apt-get install graphviz
          tox -e docs-test
  tests:
    name: Tests
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [ "3.10", "3.14" ]
        include:
          # single combination only: macOS runners are billed at a much higher rate than Linux/Windows
          - os: macos-latest
            python-version: "3.14"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run fast tests
        run: tox -e py
      
      - name: Run slow tests
        run: tox -e integration
      
      - name: Run doctests
        run: tox -e doctests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'merge_group' }}
